<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>공통 조각</title></head>
<body>

<!-- =========================================================
     공통 헤더
     사용법: <header th:replace="~{fragments/layout :: header('share')}"></header>
     active 값: 'share' / 'request' / 'news' / '' (해당 없음)
     ========================================================= -->
<header class="site-header" th:fragment="header(active)">
    <div class="site-inner">

        <a href="/" class="site-logo">
            <span class="cherry">🍒</span> 아이 봄
        </a>

        <nav class="site-nav">
            <a href="/board/share" th:classappend="${active == 'share'}   ? 'active'">나눔 게시판</a>
            <a href="/request"     th:classappend="${active == 'request'} ? 'active'">요청 게시판</a>
            <a href="/news"        th:classappend="${active == 'news'}    ? 'active'">육아소식</a>
        </nav>

        <!-- 로그인 전 -->
        <div class="site-actions" th:if="${session.loginUserId == null}">
            <a href="/member/add" class="hdr-ghost">회원가입</a>
            <a href="/member/login" class="hdr-login">로그인</a>
        </div>

        <!-- 로그인 후 -->
        <div class="site-actions" th:if="${session.loginUserId != null}">

            <a href="/board/shareWrite" class="hdr-write">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zm17.7-10.2a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                글 작성하기
            </a>

            <!-- TODO: 알림 기능 연결 예정 -->
            <button type="button" class="hdr-icon" aria-label="알림">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            </button>

            <a href="/mypage" class="hdr-icon" aria-label="마이페이지">
                <svg width="28" height="28" viewBox="0 0 34 34" fill="none" aria-hidden="true"><circle cx="17" cy="17" r="15.5" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="13" r="5" fill="currentColor"/><path d="M8 27c1.6-4.2 5-6.5 9-6.5s7.4 2.3 9 6.5" fill="currentColor"/></svg>
            </a>

        </div>

    </div>
</header>


<!-- =========================================================
     공통 푸터
     사용법: <footer th:replace="~{fragments/layout :: footer}"></footer>
     ========================================================= -->
<footer class="site-footer" th:fragment="footer">
    <div class="site-inner">

        <div class="ft-company">(주)iBom</div>

        <div class="ft-line">
            대표 아무개&nbsp;&nbsp;|&nbsp;
            위치: 대충 어딘가의 주소지&nbsp;&nbsp;|&nbsp;
            사업자번호: 144-456-898&nbsp;&nbsp;|&nbsp;
            대표전화: 1544-5656
        </div>

        <div class="ft-line">
            <a href="#">개인정보취급방침</a>&nbsp;&nbsp;|&nbsp;
            <a href="#">이용약관</a>&nbsp;&nbsp;|&nbsp;
            <a href="#">손해배상 청구절차</a>
        </div>

        <div class="ft-line">
            대표 상담 전화: 1544-5656&nbsp;&nbsp;|&nbsp;
            주말 및 공휴일 상담 가능합니다. (오전 9시 ~ 오후 11시)
        </div>

        <div class="ft-copy">COPYRIGHT@.ALL RIGHT RESERVED.</div>

    </div>
</footer>

</body>
</html>
