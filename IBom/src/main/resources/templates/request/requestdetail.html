<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요청 게시글 상세 - 아이봄</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root{
            --pink-bg: #FFEDED;
            --gray: #D9D9D9;
            --pink-card: #FFE9E4;
            --pink-main: #F8466D;
            --tag-urgent: #F28C9E;
            --white: #FFFFFF;
            --black: #000000;
        }

        *{ box-sizing:border-box; margin:0; padding:0; }

        body{
            font-family:'Noto Sans KR', sans-serif;
            color:var(--black);
            background:var(--pink-bg);
            -webkit-font-smoothing:antialiased;
        }

        a{ text-decoration:none; color:inherit; }
        button{ font-family:inherit; cursor:pointer; border:none; background:none; }

        /* ===== Header ===== */
        header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding: 18px 40px;
            background: var(--white);
            border-bottom: 1px solid #f2f2f2;
        }

        .logo{
            display:flex;
            align-items:center;
            gap:6px;
            font-size:22px;
            font-weight:900;
        }
        .logo .cherry{ font-size:20px; }

        nav{
            display:flex;
            gap:56px;
        }
        nav a{
            font-size:20px;
            font-weight:500;
            color:#222;
        }

        .header-actions{
            display:flex;
            align-items:center;
            gap:18px;
        }

        .btn-write{
            display:flex;
            align-items:center;
            gap:8px;
            background: var(--pink-main);
            color: var(--white);
            padding: 11px 20px;
            border-radius: 8px;
            font-size:14.5px;
            font-weight:700;
        }

        .icon-btn{
            width:22px;
            height:22px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#333;
        }

        /* ===== Page ===== */
        .page{
            display:flex;
            justify-content:center;
            padding: 40px 20px 80px;
        }

        .post-card{
            width:100%;
            max-width: 760px;
            background: var(--white);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 32px 40px 8px;
        }

        .post-topbar{
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin-bottom: 18px;
        }

        .tag-urgent{
            background: var(--tag-urgent);
            color: var(--white);
            font-size:14px;
            font-weight:700;
            padding: 8px 18px;
            border-radius: 20px;
        }

        .topbar-right{
            display:flex;
            align-items:center;
            gap:18px;
        }

        .share-btn{
            display:flex;
            align-items:center;
            gap:6px;
            font-size:14px;
            color:#555;
            font-weight:500;
        }
        .share-btn .mini-icon{
            width:16px;
            height:16px;
            border-radius:3px;
            display:inline-block;
        }

        .more-btn{
            font-size:20px;
            color:#999;
            letter-spacing:1px;
            line-height:1;
            padding: 4px;
        }

        .post-title{
            font-size:24px;
            font-weight:700;
            margin-bottom: 12px;
        }

        .post-meta{
            font-size:14px;
            color:#999;
            margin-bottom: 26px;
        }

        .post-body{
            font-size:15.5px;
            line-height: 1.8;
            color:#333;
            margin-bottom: 30px;
        }

        .post-footer-row{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding-bottom: 24px;
        }

        .post-category{
            font-size:14px;
            color:#999;
        }

        .post-stats{
            display:flex;
            align-items:center;
            gap:14px;
        }
        .stat{
            display:flex;
            align-items:center;
            gap:6px;
            font-size:14px;
            color:#888;
        }
        .stat .mini-icon{
            width:15px;
            height:15px;
            border-radius:3px;
            display:inline-block;
        }

        .divider-full{
            border:none;
            border-top: 1px solid #eee;
            margin: 0 -40px;
        }

        /* ===== Comments ===== */
        .comments-section{
            padding-top: 26px;
        }

        .comments-title{
            font-size:19px;
            font-weight:900;
            margin-bottom: 20px;
        }

        .comment-input-row{
            display:flex;
            align-items:stretch;
            border:1px solid #dcdcdc;
            border-radius:4px;
            overflow:hidden;
            margin-bottom:12px;
        }
        .comment-input-row input{
            flex:1;
            border:none;
            outline:none;
            font-family:inherit;
            font-size:15px;
            padding:10px 14px;
            min-width:0;
        }
        .comment-input-row input::placeholder{ color:#555; }
        .btn-register{
            background: var(--pink-main);
            color: var(--white);
            font-size:15px;
            font-weight:700;
            padding:0 18px;
            border:none;
            cursor:pointer;
            flex-shrink:0;
        }

        .comment-list{
            padding-bottom: 12px;
        }

        .comment{
            display:flex;
            gap:14px;
            padding: 20px 0;
            border-bottom: 1px solid #f2f2f2;
        }

        .comment.reply{
            margin-left: 42px;
            width: calc(100% - 42px);
        }

        .comment-avatar{
            width:42px;
            height:42px;
            border-radius:50%;
            background: #f1f1f1;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-shrink:0;
            color:#ccc;
        }

        .comment-main{
            flex:1;
            min-width:0;
        }

        .comment-name-row{
            display:flex;
            align-items:center;
            justify-content:space-between;
        }

        .comment-name-left{
            display:flex;
            align-items:center;
            gap:8px;
        }

        .comment-nickname{
            font-size:15px;
            font-weight:700;
        }

        .badge-author{
            background: var(--tag-urgent);
            color: var(--white);
            font-size:11px;
            font-weight:700;
            padding: 3px 8px;
            border-radius: 5px;
        }

        .comment-more{
            font-size:18px;
            color:#bbb;
            letter-spacing:1px;
        }

        .comment-text{
            font-size:14.5px;
            color:#333;
            margin: 8px 0 10px;
            line-height:1.6;
        }

        .comment-bottom-row{
            display:flex;
            align-items:center;
            justify-content:space-between;
        }

        .comment-meta{
            display:flex;
            align-items:center;
            gap:12px;
            font-size:13px;
            color:#aaa;
        }
        .comment-meta .reply-link{
            color:#999;
            font-weight:500;
            cursor:pointer;
        }

        .comment-like{
            display:flex;
            align-items:center;
            gap:6px;
            font-size:13px;
            color:#999;
        }
        .comment-like .mini-icon{
            width:20px;
            height:16px;
            border-radius:3px;
            background: var(--gray);
            display:inline-block;
            font-size:8px;
            text-align:center;
            line-height:16px;
            color:#666;
        }

        @media (max-width:700px){
            header{ padding:16px 20px; flex-wrap:wrap; gap:12px; }
            nav{ gap:24px; order:3; width:100%; justify-content:space-between; }
            .post-card{ padding: 26px 20px 8px; }
            .divider-full{ margin: 0 -20px; }
            .comment.reply{ margin-left:24px; width: calc(100% - 24px); }
        }

        /* 관심(하트) 버튼 */
        .btn-fav-count{
            display:inline-flex; align-items:center; gap:6px;
            padding:6px 14px; border:1px solid #e3e3e3; border-radius:999px;
            background:#fff; font-size:15px; color:#888; cursor:pointer;
            font-family:inherit;
        }
        .btn-fav-count:hover{ border-color: var(--pink-main); }
        .btn-fav-count.on{ border-color: var(--pink-main); color: var(--pink-main); }
        .btn-fav-count .heart{ font-size:16px; line-height:1; }
    </style>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<header th:replace="~{fragments/layout :: header('request')}"></header>

<div class="page">
    <div class="post-card">

        <div class="post-topbar">
            <span class="tag-urgent" th:text="${post.urgency == 'URGENT'} ? '급해요' : '여유있어요'">급해요</span>
            <div class="topbar-right">
                <button type="button" class="share-btn" id="btnShare">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
                    공유하기
                </button>
                <button class="more-btn">⋯</button>
            </div>
        </div>

        <h1 class="post-title" th:text="${post.title}">게시글 제목이 이곳에 들어갑니다</h1>
        <div class="post-meta">
            <span th:text="${nicknames[post.userId]} ?: '알 수 없음'">닉네임</span>
            ·
            <span th:text="${post.tradeRegion} ?: '지역 미입력'">서울시 마포구</span>
            ·
            <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')}">1시간 전</span>
        </div>

        <p class="post-body" th:text="${post.content}">본문 내용이 이곳에 들어갑니다.</p>

        <div class="post-footer-row">
            <div class="post-category" th:text="${post.category} ?: '카테고리 없음'">카테고리 · 세부 카테고리</div>
            <div class="post-stats">
                <form action="/favorite/toggle" method="post" style="margin:0">
                    <input type="hidden" name="postId" th:value="${post.id}">
                    <input type="hidden" name="back" th:value="'/request/requestdetail?id=' + ${post.id}">
                    <button type="submit" class="btn-fav-count" th:classappend="${favorited} ? 'on'">
                        <span class="heart" th:text="${favorited} ? '♥' : '♡'">♡</span>
                        <span th:text="${favoriteCount}">0</span>
                        관심
                    </button>
                </form>
            </div>
        </div>

        <hr class="divider-full">

        <div class="comments-section">
            <div class="comments-title">
                댓글 (<span th:text="${comments.size()}">0</span>)
            </div>

            <form action="/comment/add" method="post" class="comment-input-row">
                <input type="hidden" name="postId" th:value="${post.id}">
                <input type="text" name="content" placeholder="댓글을 입력해주세요." required>
                <button type="submit" class="btn-register">등록</button>
            </form>

            <div class="comment-list">

                <div class="comment" th:each="comment : ${comments}">
                    <div class="comment-avatar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.4-3 4-4.8 7-4.8s5.6 1.8 7 4.8"/></svg>
                    </div>
                    <div class="comment-main">
                        <div class="comment-name-row">
                            <div class="comment-name-left">
                                <span class="comment-nickname" th:text="${nicknames[comment.userId]} ?: '알 수 없음'">닉네임</span>
                            </div>
                            <button type="button" class="comment-more">⋯</button>
                        </div>
                        <div class="comment-text" th:text="${comment.content}">이곳에 댓글 내용이 들어갑니다.</div>
                        <div class="comment-bottom-row">
                            <div class="comment-meta">
                                <span th:text="${#temporals.format(comment.createdAt, 'yyyy.MM.dd. HH:mm')}">2026.04.15. 18:42</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="comment" th:if="${#lists.isEmpty(comments)}">
                    <div class="comment-main" style="padding:16px 0;color:#999">
                        첫 번째 댓글을 남겨보세요.
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<script>
    document.getElementById('btnShare').addEventListener('click', () => {
        navigator.clipboard.writeText(location.href)
            .then(() => alert('게시글 주소가 복사되었습니다.'))
            .catch(() => alert('복사에 실패했습니다. 주소창을 복사해주세요.'));
    });
</script>
</body>
</html>
```
