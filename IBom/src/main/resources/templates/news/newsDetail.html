<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>육아소식 상세 - 아이봄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-main: #F8466D;
    --pink-soft: #FFF5F6;
    --blue-main: #3F6FE0;
    --blue-soft: #EAF0FD;
    --white: #FFFFFF;
    --black: #000000;
    --line: #E8E8E8;
    --border: #DDDDDD;
    --text-sub: #777777;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:'Noto Sans KR', sans-serif;
    color:var(--black);
    background:var(--white);
    -webkit-font-smoothing:antialiased;
  }

  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  ul{ list-style:none; }
  table{ border-collapse:collapse; }

  .wrap{
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 40px;
  }

  /* ===== Header (news.html과 동일) ===== */
  header{
    background: var(--white);
    border-bottom: 1px solid #f2f2f2;
  }
  .header-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-top:18px;
    padding-bottom:18px;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:22px;
    font-weight:900;
  }
  .logo .cherry{ font-size:20px; }

  nav{
    display:flex;
    gap:56px;
  }
  nav a{
    position:relative;
    font-size:18px;
    font-weight:500;
    color:#222;
    padding-bottom: 20px;
  }
  nav a.active{
    color: var(--blue-main);
    font-weight:700;
  }
  nav a.active::after{
    content:"";
    position:absolute;
    left:-8px; right:-8px; bottom:0;
    height:3px;
    background: var(--blue-main);
    border-radius:2px;
  }

  .header-actions{
    display:flex;
    align-items:center;
    gap:22px;
  }
  .icon-btn{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#555;
  }

  /* ===== 상단 이동 줄 ===== */
  .detail-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding: 30px 0 22px;
  }
  .btn-back{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:16px;
    color:#444;
  }
  .btn-back:hover{ color: var(--blue-main); }

  .nav-buttons{
    display:flex;
    gap:14px;
  }
  .btn-nav{
    display:flex;
    align-items:center;
    gap:9px;
    border:1px solid var(--border);
    border-radius:8px;
    padding: 12px 20px;
    font-size:15px;
    color:#333;
    background: var(--white);
  }
  .btn-nav:hover{
    border-color: var(--blue-main);
    color: var(--blue-main);
  }
  .btn-nav.disabled{
    color:#bbb;
    border-color:#eee;
    cursor:default;
  }

  /* ===== 본문 카드 ===== */
  .detail-card{
    border:1px solid var(--line);
    border-radius:14px;
    background: var(--white);
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    padding: 40px 44px 44px;
    margin-bottom: 46px;
  }

  .title-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
  }
  .post-title{
    font-size:32px;
    font-weight:900;
    line-height:1.3;
  }
  .post-title .category{ color: var(--blue-main); }
  .post-title .dot{ margin: 0 6px; }

  .btn-scrap{
    display:flex;
    align-items:center;
    gap:9px;
    border:1px solid var(--border);
    border-radius:8px;
    padding: 12px 20px;
    font-size:15px;
    color:#333;
    background: var(--white);
    flex-shrink:0;
  }
  .btn-scrap:hover{ border-color: var(--pink-main); color: var(--pink-main); }
  .btn-scrap.on{
    border-color: var(--pink-main);
    color: var(--pink-main);
    background: var(--pink-soft);
  }
  .btn-scrap.on svg{ fill: currentColor; }

  .post-summary{
    font-size:16px;
    color:#777;
    margin-top: 12px;
  }

  .post-meta{
    display:flex;
    align-items:center;
    gap:36px;
    flex-wrap:wrap;
    margin-top: 26px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--line);
  }
  .meta-item{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:15px;
    color:#555;
  }
  .meta-item svg{ color:#999; flex-shrink:0; }

  /* ===== 본문 내용 ===== */
  .post-content{
    padding: 34px 0 10px;
    font-size:16px;
    line-height:1.7;
    color:#333;
  }
  .post-content > p{ margin-bottom: 30px; }

  .sec-title{
    display:flex;
    align-items:center;
    gap:11px;
    font-size:19px;
    font-weight:700;
    margin: 30px 0 14px;
  }
  .sec-title::before{
    content:"";
    width:4px;
    height:20px;
    background: var(--pink-main);
    border-radius:2px;
    flex-shrink:0;
  }

  .post-content ul{
    padding-left: 24px;
    margin-bottom: 8px;
  }
  .post-content ul li{
    position:relative;
    padding-left: 14px;
    margin-bottom: 6px;
  }
  .post-content ul li::before{
    content:"";
    position:absolute;
    left:0;
    top:11px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#666;
  }
  .post-content p.indent{ padding-left: 24px; }

  .info-table{
    margin: 16px 0 10px 24px;
    border:1px solid var(--border);
    border-radius:6px;
    overflow:hidden;
  }
  .info-table th{
    background:#F5F6F8;
    font-size:15px;
    font-weight:700;
    padding: 13px 26px;
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
  }
  .info-table td{
    font-size:15px;
    text-align:center;
    padding: 13px 26px;
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
  }
  .info-table th:last-child,
  .info-table td:last-child{ border-right:none; }
  .info-table tr:last-child td{ border-bottom:none; }
  .info-table .highlight{
    color: var(--pink-main);
    font-weight:700;
  }

  /* ===== 첨부파일 ===== */
  .attach{
    margin-top: 40px;
    padding-top: 34px;
    border-top: 1px solid var(--line);
  }
  .attach h2{
    font-size:18px;
    font-weight:700;
    margin-bottom: 16px;
  }
  .attach-item{
    display:flex;
    align-items:center;
    gap:14px;
    background:#F5F5F5;
    border-radius:8px;
    padding: 18px 20px;
  }
  .attach-item .file-name{
    flex:1;
    font-size:16px;
    font-weight:500;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .attach-item svg{ color:#666; flex-shrink:0; }
  .btn-download{
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--border);
    border-radius:8px;
    background: var(--white);
    padding: 11px 18px;
    font-size:15px;
    color:#333;
    flex-shrink:0;
  }
  .btn-download:hover{ border-color: var(--blue-main); color: var(--blue-main); }
  .btn-download:hover svg{ color: var(--blue-main); }

  /* ===== 도움이 되었나요 ===== */
  .feedback{
    display:flex;
    align-items:center;
    gap:20px;
    background: var(--pink-soft);
    border-radius:10px;
    padding: 26px 30px;
    margin-top: 34px;
  }
  .feedback .fb-icon{
    color: var(--pink-main);
    flex-shrink:0;
  }
  .fb-text{ flex:1; min-width:0; }
  .fb-text h3{
    font-size:19px;
    font-weight:700;
    margin-bottom: 6px;
  }
  .fb-text p{
    font-size:14.5px;
    color:#777;
  }
  .btn-helpful{
    display:flex;
    align-items:center;
    gap:9px;
    border:1.5px solid var(--pink-main);
    color: var(--pink-main);
    background: var(--white);
    border-radius:8px;
    padding: 13px 20px;
    font-size:16px;
    font-weight:500;
    flex-shrink:0;
  }
  .btn-helpful:hover{ background: var(--pink-main); color: var(--white); }
  .btn-helpful.on{
    background: var(--pink-main);
    color: var(--white);
  }
  .btn-helpful.on svg{ fill: currentColor; }

  /* ===== 안내 문구 (news.html과 동일) ===== */
  .notice{
    display:flex;
    align-items:center;
    gap:14px;
    background: var(--blue-soft);
    border-radius:8px;
    padding: 20px 24px;
    margin-bottom: 60px;
    font-size:15px;
    color:#4a5568;
  }
  .notice .badge{
    width:30px;
    height:30px;
    border-radius:50%;
    background: var(--blue-main);
    color: var(--white);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  /* ===== Responsive ===== */
  @media (max-width: 1000px){
    nav{ gap:30px; }
    .detail-card{ padding: 30px 26px 34px; }
    .post-title{ font-size:26px; }
  }
  @media (max-width: 700px){
    .wrap{ padding: 0 16px; }
    .header-inner{ flex-wrap:wrap; gap:12px; padding-bottom:0; }
    nav{ order:3; width:100%; justify-content:space-between; gap:0; }
    nav a{ font-size:15px; padding-bottom:14px; }
    nav a.active::after{ left:0; right:0; }
    .detail-top{ flex-direction:column; align-items:flex-start; gap:14px; padding-top:20px; }
    .nav-buttons{ width:100%; }
    .btn-nav{ flex:1; justify-content:center; padding:11px 12px; }
    .detail-card{ padding: 24px 18px 28px; }
    .title-row{ flex-direction:column; gap:14px; }
    .post-title{ font-size:22px; }
    .btn-scrap{ align-self:flex-start; }
    .post-meta{ gap:14px 20px; }
    .meta-item{ font-size:14px; }
    .post-content{ font-size:15px; }
    .sec-title{ font-size:17px; }
    .info-table{ margin-left:0; width:100%; }
    .info-table th, .info-table td{ padding: 11px 8px; font-size:13.5px; }
    .post-content ul{ padding-left:4px; }
    .post-content p.indent{ padding-left:4px; }
    .attach-item{ flex-wrap:wrap; }
    .attach-item .file-name{ flex-basis:100%; white-space:normal; }
    .feedback{ flex-wrap:wrap; gap:14px; padding:20px; }
    .btn-helpful{ width:100%; justify-content:center; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <a href="/" class="logo"><span class="cherry">🍒</span> 아이 봄</a>
    <nav>
      <a href="/board/share">나눔 게시판</a>
      <!-- TODO: 요청 게시판 URL은 Controller 매핑 추가 후 연결 -->
      <a href="#">요청 게시판</a>
      <!-- TODO: 육아소식 URL은 Controller 매핑 추가 후 연결 -->
      <a href="#" class="active">육아소식</a>
    </nav>
    <div class="header-actions">
      <!-- TODO: 알림 기능 연결 예정 -->
      <button type="button" class="icon-btn" aria-label="알림">
        <svg width="28" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </button>
      <!-- TODO: 마이페이지 연결 예정 -->
      <a href="#" class="icon-btn" aria-label="마이페이지">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true"><circle cx="17" cy="17" r="15.5" stroke="#555" stroke-width="1.5"/><circle cx="17" cy="13" r="5" fill="#555"/><path d="M8 27c1.6-4.2 5-6.5 9-6.5s7.4 2.3 9 6.5" fill="#555"/></svg>
      </a>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- ===== 목록으로 / 이전글 · 다음글 ===== -->
  <div class="detail-top">
    <!-- TODO: 육아소식 목록 URL은 Controller 매핑 추가 후 연결 -->
    <a th:href="@{/news}" class="btn-back">
      <!-- 아이콘: 왼쪽 화살표 -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="11 18 5 12 11 6"/></svg>
      목록으로 돌아가기
    </a>
    <div class="nav-buttons">
      <a th:if="${prev != null}" th:href="@{/news/detail(id=${prev.id})}" class="btn-nav">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        이전글
      </a>
      <span th:unless="${prev != null}" class="btn-nav disabled">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        이전글
      </span>

      <a th:if="${next != null}" th:href="@{/news/detail(id=${next.id})}" class="btn-nav">
        다음글
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
      <span th:unless="${next != null}" class="btn-nav disabled">
        다음글
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </span>
    </div>
  </div>

  <!-- ===== 본문 카드 ===== -->
  <article class="detail-card">

    <div class="title-row">
      <h1 class="post-title">
        <span class="category" th:text="${policy.category}">출산지원금</span><span class="dot">•</span><span th:text="${policy.title}">이곳에 제목이 들어갑니다</span>
      </h1>
    </div>

    <p class="post-summary" th:text="${policy.summary}">이곳에 정책 한줄 설명이 들어갑니다</p>

    <div class="post-meta">
      <span class="meta-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span th:text="${scopeLabel} + ' · ' + ${policy.region}">중앙정부 · 전국</span>
      </span>
      <span class="meta-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
        <span th:text="${#temporals.format(policy.createdAt, 'yyyy.MM.dd')}">2026.00.00</span>
      </span>
    </div>

    <!-- TODO: 본문은 DB에서 불러와 출력 예정 (아래는 화면 확인용 예시 내용) -->
    <!-- 본문은 DB의 CONTENT 를 그대로 출력 (관리자가 HTML 로 입력) -->
    <div class="post-content" th:utext="${policy.content}">
      본문이 이곳에 들어갑니다.
    </div>

    <!-- ===== 첨부파일 ===== -->
    <section class="attach" th:if="${policy.sourceUrl != null and !policy.sourceUrl.isEmpty()}">
      <h2>원문 보기</h2>
      <div class="attach-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>
        <span class="file-name" th:text="${policy.sourceUrl}">https://www.bokjiro.go.kr</span>
        <a th:href="${policy.sourceUrl}" target="_blank" class="btn-download">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          바로가기
        </a>
      </div>
    </section>

    <!-- ===== 도움이 되었나요 ===== -->
    <section class="feedback">
      <!-- 아이콘: 좋아요 -->
      <svg class="fb-icon" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 22H4a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1h3"/><path d="M7 12l4.5-9a2.5 2.5 0 0 1 3.5 2.3V9h4.3a2 2 0 0 1 2 2.5l-1.8 7A2 2 0 0 1 17.5 20H7z"/></svg>
      <div class="fb-text">
        <h3>이 글이 도움이 되었나요?</h3>
        <p>여러분의 의견이 더 나은 정보를 만드는 데 큰 힘이 됩니다.</p>
      </div>
      <!-- TODO: 도움이 되었어요 백엔드 연결 예정 -->
      <button type="button" class="btn-helpful" id="btnHelpful" aria-pressed="false">
        도움이 되었어요
        <!-- 아이콘: 하트 -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1l8.8 8.8 8.8-8.8a5 5 0 0 0 0-7.1z"/></svg>
      </button>
    </section>

  </article>

  <div class="notice">
    <span class="badge">
      <!-- 아이콘: 안내 -->
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="12" y1="7.5" x2="12" y2="7.6"/></svg>
    </span>
    정책 및 지원 내용은 변경될 수 있으므로, 자세한 사항은 해당 기관의 공식 홈페이지에서 확인해주세요.
  </div>

</main>

<script>
  /* 스크랩 (화면 표시만) */
  const btnScrap = document.getElementById('btnScrap');
  btnScrap.addEventListener('click', () => {
    const on = btnScrap.classList.toggle('on');
    btnScrap.setAttribute('aria-pressed', on);
    // TODO: 백엔드 API 연결 예정 (스크랩 추가/삭제)
  });

  /* 도움이 되었어요 (화면 표시만) */
  const btnHelpful = document.getElementById('btnHelpful');
  btnHelpful.addEventListener('click', () => {
    const on = btnHelpful.classList.toggle('on');
    btnHelpful.setAttribute('aria-pressed', on);
    // TODO: 백엔드 API 연결 예정 (도움이 되었어요 수 증가/취소)
  });
</script>

</body>
</html>
